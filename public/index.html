<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScamGuard AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">🛡️</div>

        <h1>ScamGuard AI</h1>

        <div class="scan-options">
            <button id="messageOption">💬 Message</button>
            <button id="emailOption">📧 Email</button>
        </div>

        <p class="subtitle">
            Protect yourself from online scams with AI-powered detection.
        </p>


        <!-- =========================
             MESSAGE SCANNER
        ========================== -->

        <div id="messageScanner">

            <textarea
                id="messageBox"
                placeholder="Paste a suspicious message here..."
            ></textarea>

        </div>


        <!-- =========================
             EMAIL SCANNER
        ========================== -->

        <div id="emailScanner" style="display: none;">

            <input
                type="email"
                id="senderEmail"
                placeholder="📧 Sender email address"
            >

            <input
                type="text"
                id="emailSubject"
                placeholder="📝 Email subject"
            >

            <textarea
                id="emailBody"
                placeholder="📄 Paste the email content here..."
            ></textarea>

            <input
                type="url"
                id="emailLink"
                placeholder="🔗 Optional suspicious link"
            >

        </div>


        <!-- =========================
             ACTION BUTTONS
        ========================== -->

        <button id="checkButton">🔍 Check Message</button>

        <button id="clearButton">🗑️ Clear</button>


        <!-- =========================
             RESULT
        ========================== -->

        <div class="result">

            <h2>⚠️ Risk Analysis</h2>

            <div class="risk-bar">
                <div class="risk-level"></div>
            </div>

            <p class="analysis"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
